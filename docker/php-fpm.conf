[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dimensionnement calé sur la limite mémoire du conteneur (768 Mo par
; défaut, cf. docker-compose.yml). Arithmétique :
;   nginx ~20 Mo + maître FPM ~30 Mo + 4 enfants x ~50 Mo = ~250 Mo au repos,
;   plus un pic à ~256 Mo si une photo est redimensionnée = ~450 Mo.
; Monter max_children sans monter la limite du conteneur exposerait à un
; arrêt brutal par manque de mémoire pendant deux envois simultanés.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recyclage périodique : protège d'une éventuelle fuite mémoire dans une
; extension sur un processus qui vivrait des jours.
pm.max_requests = 500

; Les journaux du worker partent vers la sortie du conteneur.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
