; Réglages PHP de production.
; Le redimensionnement d'une photo produit (GD + Intervention) est de loin
; le traitement le plus gourmand de l'application : les valeurs ci-dessous
; sont calées dessus, pas sur l'affichage d'une page (~28 Mo mesurés).
memory_limit = 256M

upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10

max_execution_time = 120

expose_php = Off

; Les erreurs partent vers la sortie d'erreur du conteneur (donc les
; journaux Dokploy) et ne sont jamais renvoyées au visiteur.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; OPcache : sans lui, PHP recompile chaque fichier à chaque requête.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; validate_timestamps=0 suppose que le code ne change jamais dans un
; conteneur en cours d'exécution — ce qui est le cas : un déploiement
; construit une nouvelle image. Ne pas activer en développement.
