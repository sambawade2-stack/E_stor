user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Les photos produits d'origine peuvent atteindre 10 Mo (cf. la
    # validation des uploads) : nginx doit les laisser passer.
    client_max_body_size 12M;

    keepalive_timeout 30;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        # La racine pointe sur public/ : le reste de l'application, dont
        # le .env, reste hors d'atteinte depuis le web.
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Les assets compilés portent un hash dans leur nom : ils peuvent
        # être mis en cache indéfiniment.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Images produits, servies depuis le volume via le lien symbolique
        # storage/. Durée modérée : une photo peut être remplacée.
        location /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;

            # Le traitement d'une image peut dépasser la minute par défaut.
            fastcgi_read_timeout 120s;
        }

        # Rien d'autre que index.php ne doit être exécutable, et les
        # fichiers cachés ne sont jamais servis.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
